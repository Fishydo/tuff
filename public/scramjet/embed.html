<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Static Scramjet Embed</title><style>html,body,iframe{height:100%;width:100%;margin:0;border:0;background:#0b1020;color:white;font-family:system-ui}.state{display:grid;place-items:center;height:100%;gap:1rem;text-align:center}</style></head><body><div class="state" id="state"><h1>Connecting</h1><p>Initializing proxy...</p></div><script>const p=new URLSearchParams(location.search);const raw=p.get('url')||p.get('q')||'';let url=raw;if(url&&!/^https?:\/\//i.test(url))url='https://'+url;if(url){const frame=document.createElement('iframe');frame.referrerPolicy='no-referrer';frame.allow='fullscreen; autoplay; clipboard-read; clipboard-write';frame.src=url;document.body.replaceChildren(frame)}else{document.getElementById('state').innerHTML='<h1>Connection Error</h1><p>An app URL was not provided.</p>'}</script></body></html>
